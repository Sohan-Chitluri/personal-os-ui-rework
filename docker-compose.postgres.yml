services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_USER: personal_os
      POSTGRES_DB: personal_os_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - personal-os-postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_os -d personal_os_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

volumes:
  personal-os-postgres-data:
